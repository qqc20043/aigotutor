# Alembic configuration.
#
# Scope: routine "add a column" changes are handled at startup by
# app/schema_sync.py (additive only). Alembic is for BREAKING changes
# (drop column, change type, add constraint, data migration) which need
# an explicit, revertible, auditable version record.
#
# Commands:
#   alembic revision --autogenerate -m "desc"   # diff models -> migration
#   alembic upgrade head                        # apply all
#   alembic downgrade -1                        # roll back one step
#   alembic current                             # show current revision
#   alembic history                             # list revisions
#
# NOTE: keep this file ASCII-only. Alembic reads it with the locale codec
# (GBK on this machine), so non-ASCII comments break it with UnicodeDecodeError.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# The URL is resolved in env.py from app.config.settings, so it stays empty
# here -- one source of truth, no risk of migrating the wrong database.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
